<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAGscope</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --text: #1d1d1b; --muted: #62625d;
    --border: #d9d9d3; --accent: #1f5fbf; --accent-text: #ffffff;
    --warn-bg: #fff4d6; --warn-border: #d9a400; --err-bg: #fde8e8; --err-border: #c53030;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151515; --card: #1f1f1e; --text: #ececea; --muted: #a3a39d;
      --border: #3a3a37; --accent: #6ea8ff; --accent-text: #0b0b0b;
      --warn-bg: #3a3012; --warn-border: #b38600; --err-bg: #3b1818; --err-border: #e06666;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  h2 { font-size: 1.1rem; margin: 24px 0 8px; }
  .sub { margin: 0 0 20px; color: var(--muted); }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  textarea { width: 100%; min-height: 96px; padding: 10px; font: inherit; color: inherit;
    background: var(--card); border: 1px solid var(--border); border-radius: 8px; resize: vertical; }
  button { font: inherit; cursor: pointer; border-radius: 8px; }
  button#ask { margin-top: 10px; padding: 10px 20px; border: 0; background: var(--accent); color: var(--accent-text); font-weight: 600; }
  button#ask:disabled { opacity: .6; cursor: wait; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; padding: 0; list-style: none; }
  .examples button { padding: 6px 12px; text-align: left; color: var(--text); background: var(--card); border: 1px solid var(--border); }
  .examples button:hover { border-color: var(--accent); }
  .box { padding: 12px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); }
  .answer { white-space: pre-wrap; }
  .notice { background: var(--warn-bg); border-color: var(--warn-border); }
  .error { background: var(--err-bg); border-color: var(--err-border); }
  .usage { color: var(--muted); font-size: .9rem; margin-top: 8px; }
  details { margin-bottom: 8px; padding: 8px 12px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; }
  summary { cursor: pointer; font-weight: 600; }
  details p { margin: 8px 0 0; white-space: pre-wrap; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>RAGscope</h1>
  <p class="sub">Ask a question about the Brazilian data protection law (LGPD). Answers cite the passages they came from.</p>

  <form id="form">
    <label for="question">Your question</label>
    <textarea id="question" maxlength="500" placeholder="Type your question in Portuguese"></textarea>
    <button id="ask" type="submit">Ask</button>
  </form>

  <ul class="examples" aria-label="Example questions" id="examples"></ul>

  <div id="result" aria-live="polite">
    <p id="loading" class="usage" hidden>Thinking... a local model can take a while.</p>
    <p id="error" class="box error" role="alert" hidden></p>
    <p id="refused" class="box notice" hidden><strong>No answer.</strong> The retrieved passages do not answer this question, so the system refuses to guess.</p>
    <div id="answerBox" hidden>
      <h2>Answer</h2>
      <p id="answer" class="box answer"></p>
    </div>
    <p id="usage" class="usage" hidden></p>
  </div>

  <section id="sourcesBox" hidden>
    <h2>Sources</h2>
    <div id="sources"></div>
  </section>
</main>

<script>
  const examples = [
    "Quanto tempo a empresa tem para me entregar os dados que ela guarda sobre mim?",
    "O que é considerado dado pessoal sensível?",
    "Quando uma empresa pode tratar dados de crianças?",
    "Qual é a multa máxima prevista para quem descumprir a lei?"
  ];

  const $ = (id) => document.getElementById(id);
  const form = $("form"), question = $("question"), askBtn = $("ask");

  // Server text always goes through textContent, never innerHTML.
  for (const q of examples) {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = q;
    b.addEventListener("click", () => { question.value = q; form.requestSubmit(); });
    li.appendChild(b);
    $("examples").appendChild(li);
  }

  function reset() {
    for (const id of ["error", "refused", "answerBox", "usage", "sourcesBox", "loading"]) $(id).hidden = true;
    $("sources").replaceChildren();
  }

  function showError(msg) {
    $("error").textContent = msg;
    $("error").hidden = false;
  }

  function showSources(sources) {
    if (!sources.length) return;
    for (const s of sources) {
      const d = document.createElement("details");
      const sum = document.createElement("summary");
      const art = s.article ? "Art. " + s.article : s.id;
      sum.textContent = "[" + s.n + "] " + art + " (score " + s.score.toFixed(2) + ")";
      const p = document.createElement("p");
      p.textContent = s.text;
      d.append(sum, p);
      $("sources").appendChild(d);
    }
    $("sourcesBox").hidden = false;
  }

  function showResult(r) {
    if (r.refused) {
      $("refused").hidden = false;
    } else {
      $("answer").textContent = r.answer;
      $("answerBox").hidden = false;
    }
    const u = r.usage;
    if (u.input_tokens || u.output_tokens || u.latency_ms) {
      $("usage").textContent = u.input_tokens + " tokens in, " + u.output_tokens + " out, " + (u.latency_ms / 1000).toFixed(1) + "s";
      $("usage").hidden = false;
    }
    showSources(r.sources);
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = question.value.trim();
    reset();
    if (!text) { showError("Please type a question first."); return; }

    askBtn.disabled = true;
    $("loading").hidden = false;
    try {
      const res = await fetch("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: text })
      });
      const data = await res.json();
      $("loading").hidden = true;
      if (!res.ok) showError(data.error || "Something went wrong.");
      else showResult(data);
    } catch (err) {
      $("loading").hidden = true;
      showError("Could not reach the server.");
    } finally {
      askBtn.disabled = false;
    }
  });
</script>
</body>
</html>
