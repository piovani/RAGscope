name: ragscope

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ragscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragscope}
      POSTGRES_DB: ${POSTGRES_DB:-ragscope}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ragscope}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Reranker (Hugging Face Text Embeddings Inference).
  # The image only exists for x86. On Apple Silicon it does not start, so
  # experiments with a reranker need an x86 machine for now.
  tei-rerank:
    profiles: ["reranker"]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    command: ["--model-id", "BAAI/bge-reranker-v2-m3"]
    ports:
      - "8082:80"
    volumes:
      - tei-cache:/data

volumes:
  pgdata:
  tei-cache:
