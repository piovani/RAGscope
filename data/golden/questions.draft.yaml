# DRAFT of new golden set questions (ids lgpd-035 to lgpd-072).
#
# These are NOT used by `ragscope eval` yet. Review them, edit or delete what
# you do not like, and then they get merged into questions.yaml.
#
# Differences from the first batch:
#   - written the way a person would ask, not copied from the article wording;
#   - several scenarios ("minha empresa...", "posso...?");
#   - some questions need snippets from two different articles;
#   - the unanswerable ones talk about topics the law touches but does not detail.
#
# Check the evidence with: ragscope golden --golden data/golden/questions.draft.yaml

# --- Rights of the data subject, in everyday words ---

- id: lgpd-035
  question: Quanto tempo a empresa tem para me entregar os dados que ela guarda sobre mim?
  answer: Em formato simplificado, imediatamente; ou, por declaração clara e completa, no prazo de até 15 dias.
  evidence:
    - "fornecida no prazo de até 15 (quinze) dias"

- id: lgpd-036
  question: Posso pedir uma cópia eletrônica de tudo que a empresa tem sobre mim?
  answer: Sim, quando o tratamento tiver origem no consentimento ou em contrato, o titular pode solicitar cópia eletrônica integral dos seus dados, observados os segredos comercial e industrial.
  evidence:
    - "o titular poderá solicitar cópia eletrônica integral de seus dados pessoais"

- id: lgpd-037
  question: A empresa precisa me avisar quando um serviço só funciona se eu entregar meus dados?
  answer: Sim, quando o tratamento for condição para o fornecimento de produto ou serviço, o titular deve ser informado com destaque sobre esse fato e sobre como exercer seus direitos.
  evidence:
    - "o titular será informado com destaque sobre esse fato"

- id: lgpd-038
  question: Meu consentimento vale se a empresa me deu informações enganosas?
  answer: Não, o consentimento é considerado nulo se as informações fornecidas ao titular tiverem conteúdo enganoso ou abusivo ou não tiverem sido apresentadas previamente com transparência, de forma clara e inequívoca.
  evidence:
    - "esse será considerado nulo caso as informações fornecidas ao titular tenham conteúdo enganoso ou abusivo"

- id: lgpd-039
  question: A empresa pode passar a usar meus dados para outra coisa depois que eu já autorizei?
  answer: Se a nova finalidade não for compatível com o consentimento original, o controlador deve informar previamente o titular sobre a mudança, e o titular pode revogar o consentimento.
  evidence:
    - "o controlador deverá informar previamente o titular sobre as mudanças de finalidade"

- id: lgpd-040
  question: Que informações a empresa precisa me dar sobre como meus dados são usados?
  answer: Entre outras, a finalidade específica, a forma e a duração do tratamento, a identificação e o contato do controlador, o uso compartilhado de dados, as responsabilidades dos agentes e os direitos do titular.
  evidence:
    - "forma e duração do tratamento, observados os segredos comercial e industrial"
    - "informações de contato do controlador"

- id: lgpd-041
  question: Uma empresa pode usar meus dados sem eu autorizar, alegando legítimo interesse? Com que limites?
  answer: O legítimo interesse só pode fundamentar o tratamento para finalidades legítimas, em situações concretas, e apenas os dados estritamente necessários podem ser tratados.
  evidence:
    - "O legítimo interesse do controlador somente poderá fundamentar tratamento de dados pessoais para finalidades legítimas"
    - "somente os dados pessoais estritamente necessários para a finalidade pretendida poderão ser tratados"

- id: lgpd-042
  question: Se a empresa não resolve meu problema, posso reclamar para a autoridade? Como isso funciona?
  answer: Sim, o titular pode peticionar contra o controlador perante a autoridade nacional, e a ANPD aprecia petições depois de comprovada reclamação ao controlador não solucionada no prazo regulamentar.
  evidence:
    - "O titular dos dados pessoais tem o direito de peticionar em relação aos seus dados contra o controlador perante a autoridade nacional"
    - "apreciar petições de titular contra controlador após comprovada pelo titular a apresentação de reclamação ao controlador não solucionada"

- id: lgpd-043
  question: Posso pedir que apaguem meus dados? A empresa pode se recusar?
  answer: O titular pode pedir a eliminação dos dados tratados com seu consentimento, exceto nas hipóteses do art. 16, em que a conservação é autorizada, como obrigação legal ou estudo por órgão de pesquisa.
  evidence:
    - "eliminação dos dados pessoais tratados com o consentimento do titular, exceto nas hipóteses previstas no art. 16 desta Lei"
    - "autorizada a conservação para as seguintes finalidades"

# --- When the law applies (Arts. 3 and 4) ---

- id: lgpd-044
  question: A LGPD vale para quem guarda dados de amigos só para uso pessoal?
  answer: Não, a lei não se aplica ao tratamento realizado por pessoa natural para fins exclusivamente particulares e não econômicos.
  evidence:
    - "realizado por pessoa natural para fins exclusivamente particulares e não econômicos"

- id: lgpd-045
  question: A LGPD vale para o trabalho de jornalistas?
  answer: Não, a lei não se aplica ao tratamento realizado para fins exclusivamente jornalísticos e artísticos.
  evidence:
    - "jornalístico e artísticos"

- id: lgpd-046
  question: A LGPD se aplica a dados usados pela polícia em investigações?
  answer: Não, o tratamento para fins exclusivos de segurança pública, defesa nacional, segurança do Estado e investigação e repressão de infrações penais fica fora da lei e é regido por legislação específica.
  evidence:
    - "atividades de investigação e repressão de infrações penais"

- id: lgpd-047
  question: Uma empresa com sede em outro país precisa seguir a LGPD?
  answer: Sim, a lei se aplica independentemente do país da sede da empresa, desde que, por exemplo, a operação de tratamento seja realizada no território nacional.
  evidence:
    - "independentemente do meio, do país de sua sede ou do país onde estejam localizados os dados"

# --- Anonymization, profiling and sensitive data ---

- id: lgpd-048
  question: Um dado anonimizado pode voltar a ser considerado dado pessoal?
  answer: Sim, quando o processo de anonimização for revertido, ou quando, com esforços razoáveis, puder ser revertido.
  evidence:
    - "salvo quando o processo de anonimização ao qual foram submetidos for revertido"

- id: lgpd-049
  question: Dados usados para montar o perfil de comportamento de alguém contam como dados pessoais?
  answer: Sim, podem ser considerados dados pessoais aqueles utilizados para formação do perfil comportamental de determinada pessoa natural, se identificada.
  evidence:
    - "aqueles utilizados para formação do perfil comportamental de determinada pessoa natural, se identificada"

- id: lgpd-050
  question: O plano de saúde pode usar meus dados de saúde para decidir se me aceita ou me exclui?
  answer: Não, é vedado às operadoras de planos privados de assistência à saúde o tratamento de dados de saúde para a prática de seleção de riscos, na contratação e na exclusão de beneficiários.
  evidence:
    - "É vedado às operadoras de planos privados de assistência à saúde o tratamento de dados de saúde para a prática de seleção de riscos"

- id: lgpd-051
  question: Posso repassar dados de saúde de clientes a outra empresa em troca de dinheiro?
  answer: Em regra não, é vedada a comunicação ou o uso compartilhado de dados de saúde entre controladores com objetivo de obter vantagem econômica, salvo exceções como prestação de serviços de saúde e portabilidade solicitada pelo titular.
  evidence:
    - "É vedada a comunicação ou o uso compartilhado entre controladores de dados pessoais sensíveis referentes à saúde com objetivo de obter vantagem econômica"

- id: lgpd-052
  question: Posso tratar dados sensíveis, sem consentimento, para evitar fraude no cadastro de usuários?
  answer: Sim, a lei permite sem consentimento quando indispensável para a garantia da prevenção à fraude e à segurança do titular nos processos de identificação e autenticação de cadastro em sistemas eletrônicos, resguardados os direitos do art. 9º.
  evidence:
    - "garantia da prevenção à fraude e à segurança do titular, nos processos de identificação e autenticação de cadastro em sistemas eletrônicos"

# --- Children ---

- id: lgpd-053
  question: É possível coletar dados de uma criança sem a autorização dos pais?
  answer: Só em casos específicos, como quando a coleta for necessária para contatar os pais ou o responsável, usada uma única vez e sem armazenamento, ou para a proteção da criança.
  evidence:
    - "Poderão ser coletados dados pessoais de crianças sem o consentimento a que se refere o § 1º deste artigo"

- id: lgpd-054
  question: Um jogo infantil pode exigir dados pessoais para a criança poder jogar?
  answer: Os controladores não devem condicionar a participação em jogos, aplicações de internet ou outras atividades ao fornecimento de informações pessoais além das estritamente necessárias à atividade.
  evidence:
    - "Os controladores não deverão condicionar a participação dos titulares de que trata o § 1º deste artigo em jogos"

# --- Public authorities ---

- id: lgpd-055
  question: O governo pode repassar os dados dos cidadãos para empresas privadas?
  answer: Em regra é vedado ao Poder Público transferir a entidades privadas dados pessoais de bases a que tenha acesso, salvo exceções como execução descentralizada de atividade pública, dados publicamente acessíveis e previsão legal ou contratos.
  evidence:
    - "É vedado ao Poder Público transferir a entidades privadas dados pessoais constantes de bases de dados a que tenha acesso"

- id: lgpd-056
  question: Órgãos públicos também precisam ter um encarregado de dados?
  answer: Sim, deve ser indicado um encarregado quando os órgãos públicos realizarem operações de tratamento de dados pessoais.
  evidence:
    - "seja indicado um encarregado quando realizarem operações de tratamento de dados pessoais"

# --- Liability and security ---

- id: lgpd-057
  question: Em que casos uma empresa não é responsabilizada por um dano relacionado a dados?
  answer: Quando provar que não realizou o tratamento que lhe é atribuído, que não houve violação à legislação, ou que o dano decorre de culpa exclusiva do titular ou de terceiro.
  evidence:
    - "Os agentes de tratamento só não serão responsabilizados quando provarem"

- id: lgpd-058
  question: Quando o tratamento de dados é considerado irregular?
  answer: Quando deixar de observar a legislação ou não fornecer a segurança que o titular dele pode esperar, consideradas as circunstâncias relevantes.
  evidence:
    - "O tratamento de dados pessoais será irregular quando deixar de observar a legislação ou quando não fornecer a segurança que o titular dele pode esperar"

- id: lgpd-059
  question: A empresa continua responsável pela segurança dos dados depois que acaba de usá-los?
  answer: Sim, os agentes de tratamento obrigam-se a garantir a segurança da informação em relação aos dados pessoais mesmo após o término do tratamento.
  evidence:
    - "obriga-se a garantir a segurança da informação prevista nesta Lei em relação aos dados pessoais, mesmo após o seu término"

- id: lgpd-060
  question: Em quantas horas a empresa precisa avisar sobre um vazamento?
  answer: A lei não fixa um número de horas. A comunicação deve ser feita em prazo razoável, conforme definido pela autoridade nacional.
  evidence:
    - "A comunicação será feita em prazo razoável, conforme definido pela autoridade nacional"

- id: lgpd-061
  question: Quem responde se os dados vazarem por falta de segurança?
  answer: O controlador ou o operador que, ao deixar de adotar as medidas de segurança previstas no art. 46, der causa ao dano.
  evidence:
    - "Responde pelos danos decorrentes da violação da segurança dos dados o controlador ou o operador"

# --- Sanctions and the ANPD ---

- id: lgpd-062
  question: O que a ANPD leva em conta para decidir uma sanção?
  answer: Entre outros critérios, a gravidade e a natureza das infrações e dos direitos afetados, a boa-fé do infrator, a vantagem auferida, a condição econômica, a reincidência, o grau do dano, a cooperação e a adoção de política de boas práticas e governança.
  evidence:
    - "a gravidade e a natureza das infrações e dos direitos pessoais afetados"
    - "a adoção de política de boas práticas e governança"

- id: lgpd-063
  question: A ANPD pode suspender a atividade de uma empresa logo na primeira infração?
  answer: Não, as sanções de suspensão e proibição de atividades só são aplicadas depois de já ter sido imposta ao menos uma das sanções anteriores, como advertência, multa ou publicização, para o mesmo caso.
  evidence:
    - "somente após já ter sido imposta ao menos 1 (uma) das sanções"

- id: lgpd-064
  question: Um vazamento que atingiu uma só pessoa pode ser resolvido diretamente com a empresa?
  answer: Sim, vazamentos individuais ou acessos não autorizados podem ser objeto de conciliação direta entre controlador e titular; sem acordo, aplicam-se as penalidades da lei.
  evidence:
    - "poderão ser objeto de conciliação direta entre controlador e titular"

- id: lgpd-065
  question: Quem fiscaliza o cumprimento da LGPD e quem pode aplicar as sanções?
  answer: A ANPD fiscaliza e aplica sanções em caso de tratamento realizado em descumprimento da legislação, e a aplicação das sanções da lei compete exclusivamente a ela.
  evidence:
    - "fiscalizar e aplicar sanções em caso de tratamento de dados realizado em descumprimento à legislação"
    - "A aplicação das sanções previstas nesta Lei compete exclusivamente à ANPD"

- id: lgpd-066
  question: O que precisa constar em um relatório de impacto à proteção de dados?
  answer: No mínimo, a descrição dos tipos de dados coletados, a metodologia utilizada para a coleta e para a garantia da segurança das informações e a análise do controlador sobre medidas, salvaguardas e mecanismos de mitigação de risco.
  evidence:
    - "o relatório deverá conter, no mínimo, a descrição dos tipos de dados coletados, a metodologia utilizada para a coleta e para a garantia da segurança das informações"

# --- International transfers, in everyday words ---

- id: lgpd-067
  question: Posso mandar dados de uma pessoa para o exterior se ela concordar?
  answer: Sim, quando o titular tiver fornecido consentimento específico e em destaque para a transferência, com informação prévia sobre o caráter internacional da operação, distinguindo-a de outras finalidades.
  evidence:
    - "quando o titular tiver fornecido o seu consentimento específico e em destaque para a transferência, com informação prévia sobre o caráter internacional da operação"

- id: lgpd-068
  question: Que garantias a empresa pode oferecer para enviar dados a outro país?
  answer: O controlador deve oferecer e comprovar garantias na forma de cláusulas contratuais específicas, cláusulas-padrão contratuais, normas corporativas globais ou selos, certificados e códigos de conduta regularmente emitidos.
  evidence:
    - "cláusulas contratuais específicas para determinada transferência"
    - "normas corporativas globais"

