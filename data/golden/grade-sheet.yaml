- id: lgpd-065
  question: Quem fiscaliza o cumprimento da LGPD e quem pode aplicar as sanções?
  reference_answer: A ANPD fiscaliza e aplica sanções em caso de tratamento realizado em descumprimento da legislação, e a aplicação das sanções da lei compete exclusivamente a ela.
