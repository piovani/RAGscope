- id: lgpd-098
  question: Quantas pessoas formam o Conselho Nacional de Proteção de Dados e quem participa?
  reference_answer: 'São 23 representantes, titulares e suplentes: 5 do Poder Executivo federal; 1 do Senado Federal; 1 da Câmara dos Deputados; 1 do Conselho Nacional de Justiça; 1 do Conselho Nacional do Ministério Público; 1 do Comitê Gestor da Internet no Brasil; 3 de entidades da sociedade civil com atuação relacionada a proteção de dados; 3 de instituições científicas, tecnológicas e de inovação; 3 de confederações sindicais do setor produtivo; 2 de entidades do setor empresarial; e 2 de entidades do setor laboral.'
  model_answer: "De acordo com o trecho [1] (Art. 58-A, trecho lgpd-0075), o Conselho Nacional de Proteção de Dados Pessoais e da Privacidade é composto de 23 representantes, titulares e suplentes, dos seguintes órgãos: \n\n- 5 representantes do Poder Executivo federal\n- 1 representante do Senado Federal\n- 1 representante da Câmara dos Deputados\n- 1 representante do Conselho Nacional de Justiça\n- 1 representante do Conselho Nacional do Ministério Público\n- 1 representante do Comitê Gestor da Internet no Brasil\n- 3 representantes de entidades da sociedade civil com atuação relacionada a proteção de dados pessoais\n- 3 representantes de instituições científicas, tecnológicas e de inovação\n- 3 representantes de confederações sindicais representativas das categorias econômicas do setor produtivo\n- 2 representantes do setor empresarial relacionado à área de tratamento de dados pessoais\n- 2 representantes do setor laboral\n\nPortanto, 23 pessoas formam o Conselho Nacional de Proteção de Dados Pessoais e da Privacidade, sendo representantes de diferentes órgãos e entidades."
  passages:
    - 'Art. 58-A. O Conselho Nacional de Proteção de Dados Pessoais e da Privacidade será composto de 23 (vinte e três) representantes, titulares e suplentes, dos seguintes órgãos: (Incluído pela Lei nº 13.853, de 2019) I - 5 (cinco) do Poder Executivo federal; (Incluído pela Lei nº 13.853, de 2019) II - 1 (um) do Senado Federal; (Incluído pela Lei nº 13.853, de 2019) III - 1 (um) da Câmara dos Deputados; (Incluído pela Lei nº 13.853, de 2019) IV - 1 (um) do Conselho Nacional de Justiça; (Incluído pela Lei nº 13.853, de 2019) V - 1 (um) do Conselho Nacional do Ministério Público; (Incluído pela Lei nº 13.853, de 2019) VI - 1 (um) do Comitê Gestor da Internet no Brasil; (Incluído pela Lei nº 13.853, de 2019) VII - 3 (três) de entidades da sociedade civil com atuação relacionada a proteção de dados pessoais; (Incluído pela Lei nº 13.853, de 2019) VIII - 3 (três) de instituições científicas, tecnológicas e de inovação; (Incluído pela Lei nº 13.853, de 2019) IX - 3 (três) de confederações sindicais representativas das categorias econômicas do setor produtivo; (Incluído pela Lei nº 13.853, de 2019) X - 2 (dois) de entidades representativas do setor empresarial relacionado à área de tratamento de dados pessoais; e (Incluído pela Lei nº 13.853, de 2019) XI - 2 (dois) de entidades representativas do setor laboral. (Incluído pela Lei nº 13.853, de 2019) § 1º Os representantes serão designados por ato do Presidente da República, permitida a delegação. (Incluído pela Lei nº 13.853, de 2019) § 2º Os representantes de que tratam os incisos I, II, III, IV, V e VI do caput deste artigo e seus suplentes serão indicados pelos titulares dos respectivos órgãos e entidades da administração pública. (Incluído pela Lei nº 13.853, de 2019) § 3º Os representantes de que tratam os incisos VII, VIII, IX, X e XI do caput deste artigo e seus suplentes: (Incluído pela Lei nº 13.853, de 2019) I - serão indicados na forma de regulamento; (Incluído pela Lei nº 13.853, de 2019) II - não poderão ser membros do Comitê Gestor da Internet no Brasil; (Incluído pela Lei nº 13.853, de 2019) III - terão mandato de 2 (dois) anos, permitida 1 (uma) recondução. (Incluído pela Lei nº 13.853, de 2019) § 4º A participação no Conselho Nacional de Proteção de Dados Pessoais e da Privacidade será considerada prestação de serviço público relevante, não remunerada. (Incluído pela Lei nº 13.853, de 2019)'
    - 'Art. 58-B. Compete ao Conselho Nacional de Proteção de Dados Pessoais e da Privacidade: (Incluído pela Lei nº 13.853, de 2019) I - propor diretrizes estratégicas e fornecer subsídios para a elaboração da Política Nacional de Proteção de Dados Pessoais e da Privacidade e para a atuação da ANPD; (Incluído pela Lei nº 13.853, de 2019) II - elaborar relatórios anuais de avaliação da execução das ações da Política Nacional de Proteção de Dados Pessoais e da Privacidade; (Incluído pela Lei nº 13.853, de 2019) III - sugerir ações a serem realizadas pela ANPD; (Incluído pela Lei nº 13.853, de 2019) IV - elaborar estudos e realizar debates e audiências públicas sobre a proteção de dados pessoais e da privacidade; e (Incluído pela Lei nº 13.853, de 2019) V - disseminar o conhecimento sobre a proteção de dados pessoais e da privacidade à população. (Incluído pela Lei nº 13.853, de 2019)'
    - 'Art. 55-C. A ANPD é composta de: (Incluído pela Lei nº 13.853, de 2019) I - Conselho Diretor, órgão máximo de direção; (Incluído pela Lei nº 13.853, de 2019) II - Conselho Nacional de Proteção de Dados Pessoais e da Privacidade; (Incluído pela Lei nº 13.853, de 2019) III - Corregedoria; (Incluído pela Lei nº 13.853, de 2019) IV - Ouvidoria; (Incluído pela Lei nº 13.853, de 2019) V - (revogado); (Redação dada pela Lei nº 14.460, de 2022) V-A - Procuradoria; (Redação dada pela Lei nº 15.352, de 2026) V-B - Auditoria; e (Incluído pela Lei nº 15.352, de 2026) VI - unidades administrativas e unidades especializadas. (Redação dada pela Lei nº 15.352, de 2026)'
    - 'proteção de dados pessoais: documentação do controlador que contém a descrição dos processos de tratamento de dados pessoais que podem gerar riscos às liberdades civis e aos direitos fundamentais, bem como medidas, salvaguardas e mecanismos de mitigação de risco; XVIII - órgão de pesquisa: órgão ou entidade da administração pública direta ou indireta ou pessoa jurídica de direito privado sem fins lucrativos legalmente constituída sob as leis brasileiras, com sede e foro no País, que inclua em sua missão institucional ou em seu objetivo social ou estatutário a pesquisa básica ou aplicada de caráter histórico, científico, tecnológico ou estatístico; e (Redação dada pela Lei nº 13.853, de 2019) Vigência XIX - autoridade nacional: entidade da administração pública responsável por zelar, implementar e fiscalizar o cumprimento desta Lei em todo o território nacional. (Redação dada pela Lei nº 15.352, de 2026)'
    - Art. 55-D. O Conselho Diretor da ANPD será composto de 5 (cinco) diretores, incluído o Diretor-Presidente. (Incluído pela Lei nº 13.853, de 2019) § 1º Os membros do Conselho Diretor da ANPD serão escolhidos pelo Presidente da República e por ele nomeados, após aprovação pelo Senado Federal, nos termos da alínea ‘f’ do inciso III do art. 52 da Constituição Federal, e ocuparão cargo em comissão do Grupo-Direção e Assessoramento Superiores - DAS, no mínimo, de nível 5. (Incluído pela Lei nº 13.853, de 2019) § 2º Os membros do Conselho Diretor serão escolhidos dentre brasileiros que tenham reputação ilibada, nível superior de educação e elevado conceito no campo de especialidade dos cargos para os quais serão nomeados. (Incluído pela Lei nº 13.853, de 2019) § 3º O mandato dos membros do Conselho Diretor será de 4 (quatro) anos. (Incluído pela Lei nº 13.853, de 2019) § 4º Os mandatos dos primeiros membros do Conselho Diretor nomeados serão de 2 (dois), de 3 (três), de 4 (quatro), de 5 (cinco) e de 6 (seis) anos, conforme estabelecido no ato de nomeação. (Incluído pela Lei nº 13.853, de 2019) § 5º Na hipótese de vacância do cargo no curso do mandato de membro do Conselho Diretor, o prazo remanescente será completado pelo sucessor. (Incluído pela Lei nº 13.853, de 2019)
