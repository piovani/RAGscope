# Ablation: only a reranker is added. It looks at 10 candidates and keeps the
# best 5, so the final list has the same size as the baseline's.
name: ablation-rerank
corpus: br-legislation-v1
chunking:
  strategy: fixed
  max_tokens: 512
  overlap: 64
embedding:
  model: bge-m3
retrieval:
  mode: vector
  k: 10
reranker:
  model: bge-reranker-v2-m3
  top_n: 5
generator:
  provider: ollama
  model: llama3.1
  temperature: 0
