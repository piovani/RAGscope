# Hosted model comparison through the OpenAI Chat Completions protocol. It is kept
# in this folder so `ragscope validate configs/experiments/*.yaml` (and the CI) do
# not pick it up: it needs an API key and money, and it is run on purpose.
#
# The same file reaches many providers. Change `base_url` (and the key variable):
#   OpenAI            (leave base_url out)             OPENAI_API_KEY
#   Azure OpenAI      https://<name>.openai.azure.com/openai/v1
#   GitHub Models     https://models.github.ai/inference    api_key_env: GITHUB_TOKEN
#   OpenRouter        https://openrouter.ai/api/v1     api_key_env: OPENROUTER_API_KEY
#   LM Studio / vLLM  http://localhost:1234/v1         (local: no key, no prices)
#
# Before running:
#   export OPENAI_API_KEY=...   (the key is never stored in the repository)
#   fill in the two prices below from the provider's pricing page, in US dollars
#   per million tokens. Prices change, so they are not written here for you.
#
#   ragscope eval-answers -c configs/experiments/hosted/ablation-openai.yaml --limit 20 --correctness
#
# Same retrieval as ablation-structural, only the model that writes the answers
# changes, so the difference comes from the model.
name: ablation-openai
corpus: br-legislation-v1
chunking:
  strategy: structural
  max_tokens: 512
  overlap: 64
embedding:
  model: bge-m3
retrieval:
  mode: vector
  k: 5
generator:
  provider: openai
  model: gpt-4o-mini        # any model id your provider serves
  temperature: 0
  price_input_per_mtok: 0   # TODO: fill in
  price_output_per_mtok: 0  # TODO: fill in
